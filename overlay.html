<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               font-family: Consolas, "Courier New", monospace; }
  #noise { position:fixed; inset:0; width:100%; height:100%; display:none;
           image-rendering: pixelated; pointer-events:none; }
  #hud  { position:fixed; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  #bg   { position:fixed; inset:0; background:#000; display:none; }
  #wrap { position:fixed; inset:0; color:#8cff9c; display:none; }
  #title { position:absolute; left:56px; top:20px; font-size:24px; font-weight:bold;
           letter-spacing:3px; color:#c8ffd6; }
  #title .dim { color:#5aff78; opacity:.6; font-weight:normal; letter-spacing:1px; }
  #mission { position:absolute; left:56px; top:54px; font-size:19px; letter-spacing:2px;
             color:#7aff92; opacity:.85; }
  #mission .sep { color:#3f9c52; }
  #log  { position:absolute; left:56px; top:104px; font-size:26px; line-height:38px; white-space:pre; }
  .ok   { color:#5aff78; }
  .bad  { color:#ff5050; }
  .cur  { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity:0; } }
  #bar  { position:absolute; left:56px; bottom:150px; width:900px; height:34px;
          border:2px solid #8cff9c; }
  #fill { height:100%; width:0%; background:#5aff78; transition:width .12s linear; }
  #plabel { position:absolute; left:56px; bottom:100px; font-size:28px; }
  #home { position:absolute; right:56px; bottom:60px; font-size:36px; font-weight:bold;
          color:#fff; text-shadow:0 0 8px #000; display:none; }
</style>
</head>
<body>
  <canvas id="noise"></canvas>
  <canvas id="hud"></canvas>
  <div id="bg"></div>
  <div id="wrap">
    <div id="title">BF-DRONE LINK <span class="dim">// SECURE RF UPLINK</span></div>
    <div id="mission"></div>
    <div id="log"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="plabel"></div>
  </div>
  <div id="home"></div>

<script>
var nc = document.getElementById('noise');
nc.width = 480; nc.height = 270;
var nctx = nc.getContext('2d');

function drawNoise() {
  if (nc.style.display === 'none') return;
  var img = nctx.createImageData(480, 270);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var v = (Math.random() * 255) | 0;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  nctx.putImageData(img, 0, 0);
}
setInterval(drawNoise, 70);

// Version of THIS loaded file. The tool replaces the placeholder with the file's timestamp; if the
// running tool reports a newer one, we reload so OBS can never sit on a stale overlay again.
var OVERLAY_VER = "__OVERLAY_VER__";

// ---- FPV/UAV OSD ----
var hc = document.getElementById('hud');
var hctx = hc.getContext('2d');
function sizeHud() { hc.width = window.innerWidth; hc.height = window.innerHeight; }
window.addEventListener('resize', sizeHud);
sizeHud();

function jnum(s) {
  if (!s) return 0;
  var m = String(s).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function jmetres(s) { var v = jnum(s); if (s && /km/i.test(s)) v *= 1000; return v; }

// DJI-Fly style overlay for the MAVIC - mirrors the on-monitor Mavic HUD
function drawMavic(s, W, H) {
  var col = 'rgba(255,255,255,0.95)';
  var sans = 'bold "Segoe UI", "Segoe UI Symbol", Arial, sans-serif';
  hctx.clearRect(0, 0, W, H);

  // rule-of-thirds grid: a dark line with a light core on top, so it stays visible on both the
  // bright sky and the dark ground in the OBS overlay
  function gridLine(x1, y1, x2, y2) {
    hctx.strokeStyle = 'rgba(0,0,0,0.45)'; hctx.lineWidth = 5;
    hctx.beginPath(); hctx.moveTo(x1, y1); hctx.lineTo(x2, y2); hctx.stroke();
    hctx.strokeStyle = 'rgba(255,255,255,0.65)'; hctx.lineWidth = 2;
    hctx.beginPath(); hctx.moveTo(x1, y1); hctx.lineTo(x2, y2); hctx.stroke();
  }
  for (var i = 1; i <= 2; i++) {
    gridLine(W * i / 3, 0, W * i / 3, H);
    gridLine(0, H * i / 3, W, H * i / 3);
  }
  hctx.strokeStyle = 'rgba(255,255,255,0.6)';
  hctx.beginPath();
  hctx.moveTo(W / 2 - 24, H / 2); hctx.lineTo(W / 2 - 9, H / 2);
  hctx.moveTo(W / 2 + 9, H / 2); hctx.lineTo(W / 2 + 24, H / 2);
  hctx.moveTo(W / 2, H / 2 - 24); hctx.lineTo(W / 2, H / 2 - 9);
  hctx.moveTo(W / 2, H / 2 + 9); hctx.lineTo(W / 2, H / 2 + 24);
  hctx.stroke();

  hctx.fillStyle = col;
  hctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
  hctx.fillText('N Mode', 30, 76);          // under the game's phone icons

  // top-right, under the game's "RC LIVE": battery + signal bars
  var rEdge = W - 26;
  // battery drains with the flight timer: 100% at launch, 50% at 5 min, empty at 15 min
  var fsecs = s.secs || 0;
  var bat = fsecs <= 300 ? 100 - Math.round(fsecs * 50 / 300) : 50 - Math.round((fsecs - 300) * 50 / 600);
  if (bat < 0) bat = 0; if (bat > 100) bat = 100;
  var batCol = bat <= 30 ? 'rgba(235,60,60,0.95)' : col;
  hctx.fillStyle = batCol;
  hctx.font = '17px "Segoe UI", Arial, sans-serif';
  var ptxt = bat + '%';
  var pw = hctx.measureText(ptxt).width;
  hctx.strokeStyle = 'rgba(255,255,255,0.6)'; hctx.lineWidth = 1;
  hctx.strokeRect(rEdge - 48, 70, 44, 20);
  var bfw = Math.round(32 * bat / 100);
  if (bfw > 0) hctx.fillRect(rEdge - 45, 73, bfw, 14);
  hctx.fillRect(rEdge - 4, 76, 4, 8);
  hctx.fillText(ptxt, rEdge - 56 - pw, 86);   // baseline, so it centres on the pill like the monitor
  // signal bars track the distance to HOME (4 close -> 1 far)
  var dm = jmetres(s.home || '');
  var bars = 4 - Math.floor(dm / 300);
  if (bars < 1) bars = 1; if (bars > 4) bars = 4;
  for (var b = 0; b < 4; b++) {
    hctx.fillStyle = b < bars ? col : 'rgba(235,235,235,0.35)';
    hctx.fillRect(rEdge - 64 - Math.round(pw) - 40 + b * 8, 84 - b * 4, 5, 6 + b * 4);
  }

  // bottom-centre (free): resolution + recording time
  var secs = s.secs || 0, mm = Math.floor(secs / 60), ss = secs % 60;
  var t = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  hctx.fillText('4K 30', W / 2 - 130, H - 94);
  hctx.fillText(t, W / 2 + 4, H - 94);

  // exposure above the game's PAYLOAD block
  hctx.fillText('1/60', W * 60 / 100, H - 150);
  hctx.fillText('F2.8', W * 68 / 100, H - 150);
  hctx.font = '17px "Segoe UI", Arial, sans-serif';
  hctx.fillText('ISO 100', W * 60 / 100, H - 120);
  hctx.fillText('EV+0.3', W * 68 / 100, H - 120);

  // record button
  hctx.fillStyle = 'rgba(226,32,32,0.92)';
  hctx.beginPath(); hctx.arc(W - 96, H / 2 - 3, 31, 0, Math.PI * 2); hctx.fill();
  hctx.strokeStyle = 'rgba(226,32,32,0.92)'; hctx.lineWidth = 2;
  hctx.beginPath(); hctx.arc(W - 96, H / 2 - 3, 19, 0, Math.PI * 2); hctx.stroke();
  hctx.fillStyle = col; hctx.font = '17px "Segoe UI", Arial, sans-serif';
  hctx.fillText('REC', W - 128, H / 2 - 46);
}

// ---- analog glitch state (FPV only): a brief whole-HUD horizontal jitter plus a scan bar.
// Non-destructive - nothing is ever blanked, so the overlay never disappears from OBS. ----
var glUntil = 0, glNext = 0, glShift = 0, glBars = 0;
function glitchState(now) {
  if (now > glNext) {
    glUntil = now + 40 + Math.random() * 130;
    glNext = glUntil + 6000 + Math.random() * 14000;   // every ~6-20s, easy on the eyes
    glShift = Math.round((Math.random() * 2 - 1) * (6 + Math.random() * 34));
    glBars = 1 + ((Math.random() * 2) | 0);
  }
  return now < glUntil;
}

function drawHud(s, glitching) {
  var W = hc.width, H = hc.height;
  var cx = W / 2 + (glitching ? glShift : 0);   // whole HUD jitters sideways during a glitch
  var cy = H / 2;
  hctx.clearRect(0, 0, W, H);
  if (!s.hud) { hc.style.display = 'none'; return; }
  hc.style.display = 'block';

  if (s.uav) { drawMavic(s, W, H); return; }   // DJI-Fly style for the MAVIC - clean HD, no glitch

  // The monitor FpvHudForm is authored on a 1920x1080 frame, so scale everything by H/1080 and
  // the two renders stay pixel-for-pixel the same at any OBS browser-source size.
  var sc = H / 1080;
  var col  = 'rgba(255,255,255,0.92)';   // main lines / text  (monitor _p / _g)
  var thin = 'rgba(230,230,230,0.65)';   // secondary ticks    (monitor _pt)
  var box  = 'rgba(0,0,0,0.8)';          // readout backing    (monitor _gb)
  var font = 'bold ' + Math.round(16 * sc) + 'px Consolas, monospace';

  hctx.lineCap = 'round';

  var rad = (s.roll || 0) * Math.PI / 180;
  var pit = (s.pit || 0) * sc;                    // px were measured on the 1080 frame
  function R(x, y) {
    var dx = x - cx, dy = y - cy;
    return [cx + dx * Math.cos(rad) - dy * Math.sin(rad), cy + dx * Math.sin(rad) + dy * Math.cos(rad)];
  }

  // artificial horizon + pitch ladder. Each rung is ROTATED by the detected roll so it stays PARALLEL
  // TO THE REAL HORIZON (tilted like the ground line), exactly like a gyro/instrument horizon. Pitch
  // slides the whole ladder up/down.
  hctx.font = font;
  var dpp = (typeof s.dpp === 'number' && s.dpp > 0) ? s.dpp : 8;
  var shear = (typeof s.shear === 'number') ? s.shear : 1;
  var lscale = (typeof s.len === 'number' && s.len > 0) ? s.len : 1;
  var tilt = Math.min(1, Math.abs(s.pit || 0) / 900 + Math.abs(s.roll || 0) / 180);
  var spread = 1 + 1.1 * tilt;
  var rt = rad * (typeof s.rungTilt === 'number' ? s.rungTilt : 0);
  var maxR = (typeof s.maxTilt === 'number' ? s.maxTilt : 30) * Math.PI / 180;   // cap the tilt
  if (rt > maxR) rt = maxR; if (rt < -maxR) rt = -maxR;
  var dxr = Math.cos(rt), dyr = Math.sin(rt);        // rung direction: follows bank, capped at max tilt
  for (var d = -90; d <= 90; d += 10) {
    var yy = pit + d * dpp * sc * spread;
    var dist = Math.abs(yy);
    var af = dist <= 300 * sc ? 1 : 1 - (dist - 300 * sc) / (440 * sc);   // fade 300px -> 740px
    if (af <= 0.02) continue;
    var half = (d === 0 ? 150 : 70) * sc * lscale * (1 + 0.4 * tilt);
    var ay = cy + yy;
    var cxx = cx - Math.tan(rad) * yy * shear;     // rail offset: the STAIRCASE (full bank)
    hctx.globalAlpha = af;
    hctx.strokeStyle = d === 0 ? col : thin;
    hctx.lineWidth = (d === 0 ? 2 : 1) * sc;
    var a = [cxx - half * dxr, ay - half * dyr], b = [cxx + half * dxr, ay + half * dyr];
    hctx.beginPath(); hctx.moveTo(a[0], a[1]); hctx.lineTo(b[0], b[1]); hctx.stroke();
    if (d === 0) {
      hctx.beginPath();
      hctx.moveTo(a[0], a[1]); hctx.lineTo(a[0], a[1] + 12 * sc);
      hctx.moveTo(b[0], b[1]); hctx.lineTo(b[0], b[1] + 12 * sc);
      hctx.stroke();
    } else {
      hctx.fillStyle = col;
      hctx.fillText((d > 0 ? '+' : '') + d, b[0] + 6 * sc, b[1] + 5 * sc);
    }
    hctx.globalAlpha = 1;
  }

  // bank indicator: fixed tick at the top, marker slides sideways with the bank (never rotates)
  hctx.strokeStyle = thin; hctx.lineWidth = 1 * sc;
  hctx.beginPath(); hctx.moveTo(cx, 26 * sc); hctx.lineTo(cx, 40 * sc); hctx.stroke();
  hctx.fillStyle = col;
  hctx.beginPath(); hctx.arc(cx + (s.roll || 0) * 1.2 * sc, 34 * sc, 5 * sc, 0, Math.PI * 2); hctx.fill();

  // centre reticle (with the small ring the monitor draws)
  hctx.strokeStyle = col; hctx.lineWidth = 2 * sc;
  hctx.beginPath();
  hctx.moveTo(cx - 42 * sc, cy); hctx.lineTo(cx - 12 * sc, cy);
  hctx.moveTo(cx + 12 * sc, cy); hctx.lineTo(cx + 42 * sc, cy);
  hctx.moveTo(cx, cy - 42 * sc); hctx.lineTo(cx, cy - 12 * sc);
  hctx.moveTo(cx, cy + 12 * sc); hctx.lineTo(cx, cy + 42 * sc);
  hctx.stroke();
  hctx.strokeStyle = thin; hctx.lineWidth = 1 * sc;
  hctx.beginPath(); hctx.arc(cx, cy, 3 * sc, 0, Math.PI * 2); hctx.stroke();

  // No compass tape any more - the pitch ladder's roll (the whole ladder spins about the centre
  // from the right-stick X) is the heading/attitude cue now.

  // Battery row - two packs, each a pack icon + "15.02V", like a real FPV OSD. Driven by throttle
  // on the tool side (v1/v2 in /state).
  function drawBatt(bx, by, volts) {
    var bw = 16 * sc, bh = 24 * sc;
    hctx.strokeStyle = col; hctx.lineWidth = 2 * sc;
    hctx.strokeRect(bx, by, bw, bh);
    hctx.fillStyle = col; hctx.fillRect(bx + bw / 2 - 4 * sc, by - 4 * sc, 8 * sc, 4 * sc);   // nub
    var frac = (volts - 12.0) / 8.0; if (frac < 0.06) frac = 0.06; if (frac > 1) frac = 1;
    var inner = bh - 6 * sc, fh = inner * frac;
    hctx.fillStyle = frac <= 0.16 ? 'rgba(235,60,60,0.95)' : col;
    hctx.fillRect(bx + 3 * sc, by + 3 * sc + (inner - fh), bw - 6 * sc, fh);
    hctx.fillStyle = col;
    hctx.font = 'bold ' + Math.round(15 * sc) + 'px Consolas, monospace';
    hctx.fillText(volts.toFixed(2) + 'V', bx + bw + 8 * sc, by + 19 * sc);
  }
  if (typeof s.v1 === 'number') { drawBatt(40 * sc, 74 * sc, s.v1); drawBatt(40 * sc, 108 * sc, s.v2); }

  // speed (left) and altitude (right) ladders with a backed readout box
  function ladder(left, val) {
    var lx = left ? 170 * sc : W - 170 * sc;
    hctx.strokeStyle = thin; hctx.lineWidth = 1 * sc;
    for (var k = -5; k <= 5; k++) {
      var y = cy + k * 40 * sc;
      hctx.beginPath();
      hctx.moveTo(left ? lx - 18 * sc : lx, y);
      hctx.lineTo(left ? lx : lx + 18 * sc, y);
      hctx.stroke();
    }
    if (val) {
      hctx.font = font;
      var w = hctx.measureText(val).width + 18 * sc;
      var bx = left ? lx - w + 18 * sc : lx - 18 * sc;
      hctx.fillStyle = box;
      hctx.fillRect(bx, cy - 13 * sc, w, 26 * sc);
      hctx.strokeStyle = thin; hctx.lineWidth = 1 * sc;
      hctx.strokeRect(bx, cy - 13 * sc, w, 26 * sc);
      hctx.fillStyle = col;
      hctx.fillText(val, bx + 9 * sc, cy + 4 * sc);
    }
  }
  ladder(true, s.spd);
  ladder(false, s.agl);
  // no centre HOME and no fly timer - the monitor FPV HUD leaves those to the game

  // a few faint scan lines during a glitch - additive only, never erases the HUD
  for (var b = 0; b < glBars && glitching; b++) {
    var by = (Math.random() * H) | 0;
    hctx.fillStyle = 'rgba(255,255,255,' + (0.05 + Math.random() * 0.12).toFixed(2) + ')';
    hctx.fillRect(0, by, W, 1 + ((Math.random() * 2) | 0));
  }
}

var prevLast = '', lastAt = 0;   // for the console type-out effect

function tick() {
  fetch('http://localhost:8730/state').then(function(r){ return r.json(); }).then(function(s){
    if (s.ver && OVERLAY_VER !== '__OVERLAY_VER__' && s.ver !== OVERLAY_VER) { location.reload(); return; }
    var wrap = document.getElementById('wrap');
    var bg   = document.getElementById('bg');
    var home = document.getElementById('home');
    // The CLI/loading terminal is the DEFAULT view - it shows whenever we are NOT in the drone,
    // and the HUD takes over only while flying (s.hud). No more depending on the deploy flag, so
    // OBS is never blank during the rejoin/loading/auto steps.
    var cli = !s.hud;
    wrap.style.display = cli ? 'block' : 'none';
    bg.style.display   = cli ? 'block' : 'none';

    // live mission header: what the tool is actually deploying right now (fed from settings)
    var seg = [];
    if (s.team && s.team !== '(none)') seg.push('TEAM ' + String(s.team).toUpperCase());
    if (s.drone && s.drone !== '(none)') seg.push('AIRFRAME ' + String(s.drone).toUpperCase());
    if (s.bomb && s.bomb !== '(none)') seg.push('PAYLOAD ' + String(s.bomb).toUpperCase());
    var mode = s.hud ? (s.uav ? 'UAV LINK ACTIVE' : 'FPV LINK ACTIVE')
                     : (s.active ? 'UPLINK SYNC' : 'STANDBY');
    seg.push(mode);
    document.getElementById('mission').innerHTML = seg.join(' <span class="sep">|</span> ');

    var lines = s.lines || [];
    // type out a line that starts with "> " (a console command) the moment it appears
    var lastText = lines.length ? lines[lines.length - 1][0] : '';
    if (lastText !== prevLast) { prevLast = lastText; lastAt = now; }
    var typing = lastText.indexOf('> ') === 0 && (now - lastAt) < 2500;
    var reveal = typing ? Math.max(1, Math.floor((now - lastAt) / 24)) : 1e9;
    // clock-driven blink: recomputed each frame, so it can never freeze when the log re-renders
    var cursor = '<span style="visibility:' + ((now % 1000) < 500 ? 'visible' : 'hidden') + '">_</span>';

    // only show as many lines as fit above the progress bar, so the terminal never overflows
    var maxLines = Math.max(6, Math.floor((hc.height - 104 - 240) / 38));
    var first = Math.max(0, lines.length - maxLines);
    var h = '';
    for (var i = first; i < lines.length; i++) {
      var l = lines[i];
      var cls = l[1] === 'OK' ? 'ok' : (l[1] === 'BAD' ? 'bad' : '');
      var t = (i === lines.length - 1 && typing) ? l[0].substring(0, reveal) : l[0];
      var cur = (i === lines.length - 1 && typing) ? cursor : '';
      h += '<div>' + t + ' <span class="' + cls + '">' + (l[1] ? '[' + l[1] + ']' : '') + '</span>' + cur + '</div>';
    }
    if (cli && h === '') h = '<div>bf-drone link: standby <span class="ok">[OK]</span></div>';
    if (!typing) h += '<div>' + cursor + '</div>';   // idle prompt cursor
    document.getElementById('log').innerHTML = h;
    var pctv = Math.round(s.progress * 100);
    document.getElementById('fill').style.width = pctv + '%';
    document.getElementById('plabel').textContent =
      pctv + '%   ' + String(s.label || (pctv >= 100 ? 'online' : 'standby')).toUpperCase();

    // FPV RF static: eased back from the doubled setting so it is not harsh to watch, with only
    // a small lift during a glitch. MAVIC sends level 0 and never glitches - clean HD feed.
    var now = Date.now();
    var gl = glitchState(now);
    var lvl = s.level || 0;
    var op = gl ? Math.min(1, 0.30 + Math.random() * 0.22) : Math.min(0.42, lvl * 0.42);
    var showStatic = s.hud && (op > 0.01);   // never static when the HUD is off
    nc.style.display = showStatic ? 'block' : 'none';
    nc.style.opacity = showStatic ? op : 0;

    drawHud(s, gl);

    home.style.display = 'none';   // no big bottom-right HOME readout anymore
  }).catch(function(){});
}
setInterval(tick, 40);
tick();
</script>
</body>
</html>
