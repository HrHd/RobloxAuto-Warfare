<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-store, no-cache, must-revalidate">
<meta http-equiv="pragma" content="no-cache">
<style>
  html, body { margin:0; height:100%; background:transparent; overflow:hidden;
               font-family: Consolas, "Courier New", monospace; }
  #noise { position:fixed; inset:0; width:100%; height:100%; display:none;
           image-rendering: pixelated; pointer-events:none; }
  #hud  { position:fixed; inset:0; width:100%; height:100%; display:none; pointer-events:none; }
  #bg   { position:fixed; inset:0; background:#000; display:none; }
  #wrap { position:fixed; inset:0; color:#8cff9c; display:none; }
  #log  { position:absolute; left:56px; top:64px; font-size:30px; line-height:44px; white-space:pre; }
  .ok   { color:#5aff78; }
  .bad  { color:#ff5050; }
  #bar  { position:absolute; left:56px; bottom:150px; width:900px; height:34px;
          border:2px solid #8cff9c; }
  #fill { height:100%; width:0%; background:#5aff78; transition:width .12s linear; }
  #plabel { position:absolute; left:56px; bottom:100px; font-size:30px; }
  #home { position:absolute; right:56px; bottom:60px; font-size:36px; font-weight:bold;
          color:#fff; text-shadow:0 0 8px #000; display:none; }
</style>
</head>
<body>
  <canvas id="noise"></canvas>
  <canvas id="hud"></canvas>
  <div id="bg"></div>
  <div id="wrap">
    <div id="log"></div>
    <div id="bar"><div id="fill"></div></div>
    <div id="plabel"></div>
  </div>
  <div id="home"></div>

<script>
var nc = document.getElementById('noise');
nc.width = 480; nc.height = 270;
var nctx = nc.getContext('2d');

function drawNoise() {
  if (nc.style.display === 'none') return;
  var img = nctx.createImageData(480, 270);
  var d = img.data;
  for (var i = 0; i < d.length; i += 4) {
    var v = (Math.random() * 255) | 0;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
  nctx.putImageData(img, 0, 0);
}
setInterval(drawNoise, 70);

// ---- FPV/UAV OSD ----
var hc = document.getElementById('hud');
var hctx = hc.getContext('2d');
function sizeHud() { hc.width = window.innerWidth; hc.height = window.innerHeight; }
window.addEventListener('resize', sizeHud);
sizeHud();

function jnum(s) {
  if (!s) return 0;
  var m = String(s).match(/-?\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : 0;
}
function jmetres(s) { var v = jnum(s); if (s && /km/i.test(s)) v *= 1000; return v; }

// DJI-Fly style overlay for the MAVIC - mirrors the on-monitor Mavic HUD
function drawMavic(s, W, H) {
  var col = 'rgba(255,255,255,0.95)';
  var sans = 'bold "Segoe UI", "Segoe UI Symbol", Arial, sans-serif';
  hctx.clearRect(0, 0, W, H);

  // rule-of-thirds grid: a dark line with a light core on top, so it stays visible on both the
  // bright sky and the dark ground in the OBS overlay
  function gridLine(x1, y1, x2, y2) {
    hctx.strokeStyle = 'rgba(0,0,0,0.45)'; hctx.lineWidth = 5;
    hctx.beginPath(); hctx.moveTo(x1, y1); hctx.lineTo(x2, y2); hctx.stroke();
    hctx.strokeStyle = 'rgba(255,255,255,0.65)'; hctx.lineWidth = 2;
    hctx.beginPath(); hctx.moveTo(x1, y1); hctx.lineTo(x2, y2); hctx.stroke();
  }
  for (var i = 1; i <= 2; i++) {
    gridLine(W * i / 3, 0, W * i / 3, H);
    gridLine(0, H * i / 3, W, H * i / 3);
  }
  hctx.strokeStyle = 'rgba(255,255,255,0.6)';
  hctx.beginPath();
  hctx.moveTo(W / 2 - 24, H / 2); hctx.lineTo(W / 2 - 9, H / 2);
  hctx.moveTo(W / 2 + 9, H / 2); hctx.lineTo(W / 2 + 24, H / 2);
  hctx.moveTo(W / 2, H / 2 - 24); hctx.lineTo(W / 2, H / 2 - 9);
  hctx.moveTo(W / 2, H / 2 + 9); hctx.lineTo(W / 2, H / 2 + 24);
  hctx.stroke();

  hctx.fillStyle = col;
  hctx.font = 'bold 22px "Segoe UI", Arial, sans-serif';
  hctx.fillText('N Mode', 30, 76);          // under the game's phone icons

  // top-right, under the game's "RC LIVE": signal bars + a battery pill with a nub
  var rEdge = W - 26;
  hctx.font = '17px "Segoe UI", Arial, sans-serif';
  var pw = hctx.measureText('96%').width;
  hctx.strokeStyle = 'rgba(255,255,255,0.6)'; hctx.lineWidth = 1;
  hctx.strokeRect(rEdge - 48, 70, 44, 20);
  hctx.fillRect(rEdge - 45, 73, 32, 14);
  hctx.fillRect(rEdge - 4, 76, 4, 8);
  hctx.fillText('96%', rEdge - 56 - pw, 74);
  for (var b = 0; b < 4; b++)
    hctx.fillRect(rEdge - 64 - Math.round(pw) - 40 + b * 8, 84 - b * 4, 5, 6 + b * 4);
  // (no ALT readout - the game already prints the height bottom-left)

  // bottom-centre (free): resolution + recording time
  var secs = s.secs || 0, mm = Math.floor(secs / 60), ss = secs % 60;
  var t = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  hctx.fillText('4K 30', W / 2 - 130, H - 94);
  hctx.fillText(t, W / 2 + 4, H - 94);

  // exposure above the game's PAYLOAD block
  hctx.fillText('1/60', W * 60 / 100, H - 150);
  hctx.fillText('F2.8', W * 68 / 100, H - 150);
  hctx.font = '17px "Segoe UI", Arial, sans-serif';
  hctx.fillText('ISO 100', W * 60 / 100, H - 120);
  hctx.fillText('EV+0.3', W * 68 / 100, H - 120);

  // record button
  hctx.fillStyle = 'rgba(226,32,32,0.92)';
  hctx.beginPath(); hctx.arc(W - 96, H / 2 - 3, 31, 0, Math.PI * 2); hctx.fill();
  hctx.strokeStyle = 'rgba(226,32,32,0.92)'; hctx.lineWidth = 2;
  hctx.beginPath(); hctx.arc(W - 96, H / 2 - 3, 19, 0, Math.PI * 2); hctx.stroke();
  hctx.fillStyle = col; hctx.font = '17px "Segoe UI", Arial, sans-serif';
  hctx.fillText('REC', W - 128, H / 2 - 46);
}

function drawHud(s) {
  var W = hc.width, H = hc.height, cx = W / 2, cy = H / 2;
  hctx.clearRect(0, 0, W, H);
  if (!s.hud) { hc.style.display = 'none'; return; }
  hc.style.display = 'block';

  if (s.uav) { drawMavic(s, W, H); return; }   // DJI-Fly style for the MAVIC

  var col = 'rgba(255,255,255,0.92)';
  hctx.strokeStyle = col;
  hctx.fillStyle = col;
  hctx.lineWidth = 2;
  hctx.font = 'bold 16px Consolas, monospace';

  var rad = (s.roll || 0) * Math.PI / 180;
  var pit = (s.pit || 0) * (H / 1080);          // px were measured on the 1080 frame
  function R(x, y) {
    var dx = x - cx, dy = y - cy;
    return [cx + dx * Math.cos(rad) - dy * Math.sin(rad), cy + dx * Math.sin(rad) + dy * Math.cos(rad)];
  }

  // artificial horizon + pitch ladder
  for (var d = -30; d <= 30; d += 10) {
    var yy = pit + d * 4, half = d === 0 ? 130 : 70;
    var a = R(cx - half, cy + yy), b = R(cx + half, cy + yy);
    hctx.beginPath(); hctx.moveTo(a[0], a[1]); hctx.lineTo(b[0], b[1]); hctx.stroke();
    if (d !== 0) { var t = R(cx + half + 6, cy + yy - 8); hctx.fillText((d > 0 ? '+' : '') + d, t[0], t[1]); }
  }

  // centre reticle
  hctx.beginPath();
  hctx.moveTo(cx - 42, cy); hctx.lineTo(cx - 12, cy);
  hctx.moveTo(cx + 12, cy); hctx.lineTo(cx + 42, cy);
  hctx.moveTo(cx, cy - 42); hctx.lineTo(cx, cy - 12);
  hctx.moveTo(cx, cy + 12); hctx.lineTo(cx, cy + 42);
  hctx.stroke();

  // compass tape, top-centre
  var h = parseInt(s.hdg, 10);
  if (!isNaN(h)) {
    for (var d2 = -60; d2 <= 60; d2 += 10) {
      var deg = ((h + d2) % 360 + 360) % 360, x = cx + d2 * 6;
      if (d2 === 0) { hctx.fillText(h + '\u00b0', x - 16, 42); }
      else {
        hctx.beginPath(); hctx.moveTo(x, 26); hctx.lineTo(x, 40); hctx.stroke();
        if (deg % 30 === 0) hctx.fillText(deg, x - 14, 58);
      }
    }
  }

  // speed (left) and altitude (right) ladders
  function ladder(left, val) {
    var lx = left ? 170 : W - 170;
    for (var k = -5; k <= 5; k++) {
      var y = cy + k * 40;
      hctx.beginPath(); hctx.moveTo(left ? lx - 18 : lx, y); hctx.lineTo(left ? lx : lx + 18, y); hctx.stroke();
    }
    if (val) {
      var w = hctx.measureText(val).width + 18;
      var bx = left ? lx - w + 18 : lx - 18;
      hctx.fillStyle = 'rgba(0,0,0,0.55)';
      hctx.fillRect(bx, cy - 13, w, 26);
      hctx.strokeStyle = 'rgba(255,255,255,0.6)';
      hctx.strokeRect(bx, cy - 13, w, 26);
      hctx.fillStyle = col;
      hctx.fillText(val, bx + 9, cy + 6);
    }
  }
  ladder(true, s.spd);
  ladder(false, s.agl);

  // home distance + timer
  hctx.font = 'bold 20px Consolas, monospace';
  hctx.fillText('HOME ' + s.home, cx - 70, cy + 130);
  hctx.font = 'bold 16px Consolas, monospace';
  var mm = Math.floor((s.secs || 0) / 60), ss = (s.secs || 0) % 60;
  hctx.fillText((s.uav ? 'UAV' : 'FPV') + '   ' + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss, 40, H - 40);
}

function tick() {
  fetch('http://localhost:8730/state').then(function(r){ return r.json(); }).then(function(s){
    var wrap = document.getElementById('wrap');
    var bg   = document.getElementById('bg');
    var home = document.getElementById('home');
    wrap.style.display = s.active ? 'block' : 'none';
    bg.style.display   = s.active ? 'block' : 'none';

    var h = '';
    for (var i = 0; i < s.lines.length; i++) {
      var l = s.lines[i];
      var cls = l[1] === 'OK' ? 'ok' : (l[1] === 'BAD' ? 'bad' : '');
      h += '<div>' + l[0] + ' <span class="' + cls + '">' + (l[1] ? '[' + l[1] + ']' : '') + '</span></div>';
    }
    document.getElementById('log').innerHTML = h;
    document.getElementById('fill').style.width = Math.round(s.progress * 100) + '%';
    document.getElementById('plabel').textContent = Math.round(s.progress * 100) + '%   ' + s.label;

    // RF static while flying: intensity follows the HOME distance (fullest at 1.20 km)
    nc.style.display = s.flight ? 'block' : 'none';
    nc.style.opacity = s.flight ? Math.min(0.35, (s.level || 0) * 0.35) : 0;

    drawHud(s);

    home.style.display = 'none';   // no big bottom-right HOME readout anymore
  }).catch(function(){});
}
setInterval(tick, 120);
tick();
</script>
</body>
</html>
